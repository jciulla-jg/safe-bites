# Keeps the free Supabase project from auto-pausing (it pauses after about a
# week with no activity) by making one tiny read every 3 days. Free on public
# repos. Needs two repository secrets (Settings -> Secrets and variables ->
# Actions): SUPABASE_URL and SUPABASE_ANON_KEY, the same values as .env.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one allergen row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets first."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/allergens?select=code&limit=1"
